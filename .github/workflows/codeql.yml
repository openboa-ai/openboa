name: codeql

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:
  workflow_call:
    inputs:
      strict_postmerge:
        description: Require actual clean raw analysis for the separately reviewed writer continuation.
        default: false
        type: boolean
      isolated_analysis:
        description: Keep validation raw evidence separate from production uploads.
        default: false
        type: boolean

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            category: .github/workflows/codeql.yml:analyze
          - language: python
            category: .github/workflows/codeql.yml:analyze-python
          - language: actions
            category: .github/workflows/codeql.yml:analyze-actions
    steps:
      - name: Validate revision
        shell: bash
        env:
          REVISION: ${{ github.sha }}
        run: |
          if [[ ! "${REVISION}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Revision must be an immutable full commit SHA"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Record source receipt
        shell: bash
        env:
          REPOSITORY_ID: ${{ github.repository_id }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          WORKFLOW_PATH: .github/workflows/codeql.yml
          JOB_NAME: "analyze (${{ matrix.language }})"
          EXPECTED_REVISION: ${{ github.sha }}
          RECEIPT_DIRECTORY: ${{ runner.temp }}/merge-source
          LANGUAGE: ${{ matrix.language }}
          CATEGORY: ${{ inputs.isolated_analysis == true && 'reusable-validation:' || '' }}${{ matrix.category }}
        run: |
          python3 - <<'PYTHON'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          def git(*args):
              return subprocess.check_output(["git", *args])

          def sha(value):
              if len(value) != 40 or any(c not in "0123456789abcdef" for c in value):
                  raise SystemExit("Invalid source SHA")
              return value

          event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text())
          checkout = sha(git("rev-parse", "HEAD").decode().strip())
          if checkout != sha(os.environ["EXPECTED_REVISION"]):
              raise SystemExit("Checkout does not match the requested source")
          workflow_sha = sha(os.environ["WORKFLOW_SHA"])
          workflow_path = os.environ["WORKFLOW_PATH"]
          workflow_bytes = git("show", f"{workflow_sha}:{workflow_path}")
          commit = git("cat-file", "-p", checkout).decode().split("\n\n", 1)[0]
          parents = [sha(line[7:]) for line in commit.splitlines() if line.startswith("parent ")]
          pull = event.get("pull_request", {})
          source_files = []
          language = os.environ.get("LANGUAGE", "")
          for record in git("ls-tree", "-r", "-z", checkout).split(b"\0"):
              if not record:
                  continue
              metadata, path_bytes = record.split(b"\t", 1)
              mode, kind, blob = metadata.decode().split()
              path = path_bytes.decode("utf-8", "strict")
              suffix = Path(path).suffix.lower()
              include = ((language == "javascript-typescript" and suffix in {".js", ".jsx", ".ts", ".tsx", ".mjs", ".cjs", ".mts", ".cts"})
                         or (language == "python" and suffix == ".py")
                         or (language == "actions" and path.startswith(".github/workflows/") and suffix in {".yml", ".yaml"}))
              if include:
                  source_files.append({"path": path, "mode": mode, "type": kind, "blob": blob})
          receipt = {
              "schemaVersion": 1,
              "repositoryId": int(os.environ["REPOSITORY_ID"]),
              "repository": os.environ["GITHUB_REPOSITORY"],
              "runId": int(os.environ["GITHUB_RUN_ID"]),
              "runAttempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "workflowRef": os.environ["WORKFLOW_REF"],
              "workflowPath": workflow_path,
              "workflowSha": workflow_sha,
              "workflowSha256": hashlib.sha256(workflow_bytes).hexdigest(),
              "event": os.environ["GITHUB_EVENT_NAME"],
              "eventSha": sha(os.environ["GITHUB_SHA"]),
              "headSha": pull.get("head", {}).get("sha"),
              "baseSha": pull.get("base", {}).get("sha"),
              "checkoutSha": checkout,
              "parents": parents,
              "sourceTree": git("rev-parse", "HEAD^{tree}").decode().strip(),
              "sourceFiles": source_files,
              "jobName": os.environ["JOB_NAME"],
              "language": language or None,
              "category": os.environ.get("CATEGORY") or None,
          }
          output = Path(os.environ["RECEIPT_DIRECTORY"])
          output.mkdir(parents=True, exist_ok=True)
          (output / "receipt.json").write_text(json.dumps(receipt, indent=2) + "\n")
          print(f"Recorded actual source {checkout} and {len(source_files)} tracked language files")
          PYTHON

      - name: Initialize CodeQL
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          category: ${{ inputs.isolated_analysis == true && 'reusable-validation:' || '' }}${{ matrix.category }}
          upload: ${{ inputs.isolated_analysis == true && 'never' || 'always' }}
          output: ${{ runner.temp }}/codeql-results

      - name: Validate reusable analysis output
        if: inputs.isolated_analysis == true
        shell: bash
        env:
          SARIF_DIRECTORY: ${{ runner.temp }}/codeql-results
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          from pathlib import Path

          files = list(Path(os.environ["SARIF_DIRECTORY"]).glob("*.sarif"))
          if not files:
              raise SystemExit("CodeQL produced no SARIF")
          for path in files:
              document = json.loads(path.read_text())
              if document.get("version") != "2.1.0" or not document.get("runs"):
                  raise SystemExit("Invalid or empty CodeQL analysis")
              for run in document["runs"]:
                  if run.get("tool", {}).get("driver", {}).get("name") != "CodeQL":
                      raise SystemExit("Unexpected analysis tool")
                  if not isinstance(run.get("results"), list):
                      raise SystemExit("Missing analysis results")
          print(f"Validated {len(files)} genuine CodeQL SARIF document(s)")
          PYTHON

      - name: Prepare merge evidence
        id: prepare_evidence
        shell: bash
        env:
          LANGUAGE: ${{ matrix.language }}
          SARIF_DIRECTORY: ${{ runner.temp }}/codeql-results
          RECEIPT_DIRECTORY: ${{ runner.temp }}/merge-source
          EVIDENCE_DIRECTORY: ${{ runner.temp }}/merge-evidence
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          import shutil
          from pathlib import Path

          language = os.environ["LANGUAGE"]
          inputs = list(Path(os.environ["SARIF_DIRECTORY"]).glob("*.sarif"))
          if len(inputs) != 1:
              raise SystemExit("Expected exactly one language SARIF document")
          document = json.loads(inputs[0].read_text())
          if document.get("version") != "2.1.0" or not document.get("runs"):
              raise SystemExit("Invalid CodeQL SARIF")
          for run in document["runs"]:
              if run.get("tool", {}).get("driver", {}).get("name") != "CodeQL":
                  raise SystemExit("Unexpected analysis tool")
          output = Path(os.environ["EVIDENCE_DIRECTORY"])
          output.mkdir(parents=True, exist_ok=True)
          shutil.copyfile(inputs[0], output / (language + ".sarif"))
          shutil.copyfile(Path(os.environ["RECEIPT_DIRECTORY"]) / "receipt.json", output / "receipt.json")
          PYTHON

      - name: Require strict post-merge raw evidence
        if: inputs.strict_postmerge == true
        env:
          LANGUAGE: ${{ matrix.language }}
          REQUESTED_REVISION: ${{ github.sha }}
          REPOSITORY_ID: ${{ github.repository_id }}
          GITHUB_WORKFLOW_SHA: ${{ github.workflow_sha }}
          ISOLATED_ANALYSIS: ${{ inputs.isolated_analysis }}
        run: |
          test "$ISOLATED_ANALYSIS" = true
          python3 scripts/validate-postmerge-sarif.py \
            --directory "$RUNNER_TEMP/merge-evidence" --language "$LANGUAGE" \
            --revision "$REQUESTED_REVISION" --repository "$GITHUB_REPOSITORY" \
            --repository-id "$REPOSITORY_ID" --run-id "$GITHUB_RUN_ID" \
            --attempt "$GITHUB_RUN_ATTEMPT" --workflow-sha "$GITHUB_WORKFLOW_SHA" \
            --workflow-ref "$GITHUB_WORKFLOW_REF" --event "$GITHUB_EVENT_NAME" \
            --event-sha "$GITHUB_SHA" --source-root "$GITHUB_WORKSPACE"

      - name: Upload merge evidence
        # Preserve already-prepared raw evidence when the optional strict gate
        # fails; the failed gate/job still blocks the continuation aggregate.
        if: always() && !cancelled() && steps.prepare_evidence.outcome == 'success' && (success() || inputs.strict_postmerge == true)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: merge-evidence-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.language }}
          path: ${{ runner.temp }}/merge-evidence/*
          if-no-files-found: error
          retention-days: 7
