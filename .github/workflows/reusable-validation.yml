name: reusable-validation

on:
  pull_request:
    paths:
      - ".github/workflows/ci.yml"
      - ".github/workflows/codeql.yml"
      - ".github/workflows/dependency-audit.yml"
      - ".github/workflows/reusable-validation.yml"
      - "test/reusable-workflows.test.ts"
      - ".github/merge-canary-policy.json"
      - ".github/workflows/merge-canary.yml"
      - "scripts/collect-merge-evidence.py"
      - "scripts/evaluate-merge-canary.mjs"
      - "test/test_collect_merge_evidence.py"
      - "test/merge-canary-adapter.test.mjs"
      - "test/merge-source-receipt.test.ts"

permissions:
  contents: read

# This intentionally adds one full CI/native build and three CodeQL analyses when
# reusable workflow plumbing changes. Its caller name isolates CI concurrency.
jobs:
  validation-scope:
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      reusable: ${{ steps.paths.outputs.reusable }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select reusable call validation
        id: paths
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          filters: |
            reusable:
              - ".github/workflows/ci.yml"
              - ".github/workflows/codeql.yml"
              - ".github/workflows/dependency-audit.yml"
              - ".github/workflows/reusable-validation.yml"
              - "test/reusable-workflows.test.ts"

  validate-ci-call:
    needs: [validation-scope]
    if: needs.validation-scope.outputs.reusable == 'true'
    uses: ./.github/workflows/ci.yml
    with:
      revision: ${{ github.sha }}
      full_scope: true

  validate-codeql-call:
    needs: [validation-scope]
    if: needs.validation-scope.outputs.reusable == 'true'
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: ./.github/workflows/codeql.yml
    with:
      revision: ${{ github.sha }}
      analysis_ref: refs/heads/main
      upload_results: false

  validate-evidence-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout test candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout reviewed evaluator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: openboa-ai/.github
          ref: ad38905cbe5c4113665c8ce38ee4798a1fce5fae
          path: .merge-evaluator
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Test real evaluator adapter and read-only collector
        env:
          MERGE_EVALUATOR_MODULE: ${{ github.workspace }}/.merge-evaluator/lib/evaluate-merge-evidence.mjs
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          node --test test/merge-canary-adapter.test.mjs
          python3 -m unittest discover -s test -p 'test_collect_merge_evidence.py'
