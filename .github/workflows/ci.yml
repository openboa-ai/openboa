name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      full_scope:
        description: Run all validation lanes independently of changed paths.
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dependency-audit:
    uses: ./.github/workflows/dependency-audit.yml

  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.flags.outputs.docs_only }}
      docs_changed: ${{ steps.flags.outputs.docs_changed }}
      desktop_changed: ${{ steps.flags.outputs.desktop_changed }}
    steps:
      - name: Validate revision
        shell: bash
        env:
          REVISION: ${{ github.sha }}
        run: |
          if [[ ! "${REVISION}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Revision must be an immutable full commit SHA"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Record source receipt
        shell: bash
        env:
          REPOSITORY_ID: ${{ github.repository_id }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          WORKFLOW_PATH: .github/workflows/ci.yml
          JOB_NAME: "scope"
          EXPECTED_REVISION: ${{ github.sha }}
          RECEIPT_DIRECTORY: ${{ runner.temp }}/merge-source
        run: |
          python3 - <<'PYTHON'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          def git(*args):
              return subprocess.check_output(["git", *args])

          def sha(value):
              if len(value) != 40 or any(c not in "0123456789abcdef" for c in value):
                  raise SystemExit("Invalid source SHA")
              return value

          event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text())
          checkout = sha(git("rev-parse", "HEAD").decode().strip())
          if checkout != sha(os.environ["EXPECTED_REVISION"]):
              raise SystemExit("Checkout does not match the requested source")
          workflow_sha = sha(os.environ["WORKFLOW_SHA"])
          workflow_path = os.environ["WORKFLOW_PATH"]
          workflow_bytes = git("show", f"{workflow_sha}:{workflow_path}")
          commit = git("cat-file", "-p", checkout).decode().split("\n\n", 1)[0]
          parents = [sha(line[7:]) for line in commit.splitlines() if line.startswith("parent ")]
          pull = event.get("pull_request", {})
          source_files = []
          language = os.environ.get("LANGUAGE", "")
          for record in git("ls-tree", "-r", "-z", checkout).split(b"\0"):
              if not record:
                  continue
              metadata, path_bytes = record.split(b"\t", 1)
              mode, kind, blob = metadata.decode().split()
              path = path_bytes.decode("utf-8", "strict")
              suffix = Path(path).suffix.lower()
              include = ((language == "javascript-typescript" and suffix in {".js", ".jsx", ".ts", ".tsx", ".mjs", ".cjs", ".mts", ".cts"})
                         or (language == "python" and suffix == ".py")
                         or (language == "actions" and path.startswith(".github/workflows/") and suffix in {".yml", ".yaml"}))
              if include:
                  source_files.append({"path": path, "mode": mode, "type": kind, "blob": blob})
          receipt = {
              "schemaVersion": 1,
              "repositoryId": int(os.environ["REPOSITORY_ID"]),
              "repository": os.environ["GITHUB_REPOSITORY"],
              "runId": int(os.environ["GITHUB_RUN_ID"]),
              "runAttempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "workflowRef": os.environ["WORKFLOW_REF"],
              "workflowPath": workflow_path,
              "workflowSha": workflow_sha,
              "workflowSha256": hashlib.sha256(workflow_bytes).hexdigest(),
              "event": os.environ["GITHUB_EVENT_NAME"],
              "eventSha": sha(os.environ["GITHUB_SHA"]),
              "headSha": pull.get("head", {}).get("sha"),
              "baseSha": pull.get("base", {}).get("sha"),
              "checkoutSha": checkout,
              "parents": parents,
              "sourceTree": git("rev-parse", "HEAD^{tree}").decode().strip(),
              "sourceFiles": source_files,
              "jobName": os.environ["JOB_NAME"],
              "language": language or None,
              "category": os.environ.get("CATEGORY") or None,
          }
          output = Path(os.environ["RECEIPT_DIRECTORY"])
          output.mkdir(parents=True, exist_ok=True)
          (output / "receipt.json").write_text(json.dumps(receipt, indent=2) + "\n")
          print(f"Recorded actual source {checkout} and {len(source_files)} tracked language files")
          PYTHON

      - name: Upload source receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: merge-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/merge-source/receipt.json
          if-no-files-found: error
          retention-days: 7

      - name: Detect docs scope
        if: inputs.full_scope != true
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            docs:
              - "README.md"
              - "docs/**"
              - "**/*.md"
            desktop:
              - ".github/workflows/ci.yml"
              - "package.json"
              - "pnpm-lock.yaml"
              - "electron-builder.yml"
              - "src/shell/desktop/**"
              - "src/shell/web/**"
              - "test/company-shell-desktop.test.ts"
            non_docs:
              - "**"
              - "!README.md"
              - "!docs/**"
              - "!**/*.md"

      - name: Compute scope flags
        id: flags
        shell: bash
        env:
          FULL_SCOPE: ${{ inputs.full_scope && 'true' || 'false' }}
          DOCS_CHANGED: ${{ steps.filter.outputs.docs }}
          DESKTOP_CHANGED: ${{ steps.filter.outputs.desktop }}
          NON_DOCS_CHANGED: ${{ steps.filter.outputs.non_docs }}
        run: |
          case "${FULL_SCOPE}" in
            true)
              echo "docs_changed=true" >> "$GITHUB_OUTPUT"
              echo "desktop_changed=true" >> "$GITHUB_OUTPUT"
              echo "docs_only=false" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
            false) ;;
            *) echo "Invalid full-scope mode"; exit 1 ;;
          esac

          for flag in "${DOCS_CHANGED}" "${DESKTOP_CHANGED}" "${NON_DOCS_CHANGED}"; do
            if [[ "${flag}" != "true" && "${flag}" != "false" ]]; then
              echo "Invalid path-filter output: ${flag}"
              exit 1
            fi
          done

          if [[ "${DOCS_CHANGED}" == "true" ]]; then
            echo "docs_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs_changed=false" >> "$GITHUB_OUTPUT"
          fi

          if [[ "${DESKTOP_CHANGED}" == "true" ]]; then
            echo "desktop_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "desktop_changed=false" >> "$GITHUB_OUTPUT"
          fi

          if [[ "${DOCS_CHANGED}" == "true" && "${NON_DOCS_CHANGED}" == "false" ]]; then
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          fi

  check:
    needs: [scope]
    if: needs.scope.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate revision
        shell: bash
        env:
          REVISION: ${{ github.sha }}
        run: |
          if [[ ! "${REVISION}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Revision must be an immutable full commit SHA"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: "10.23.0"

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run checks
        run: pnpm check

  docs:
    needs: [scope]
    if: needs.scope.outputs.docs_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate revision
        shell: bash
        env:
          REVISION: ${{ github.sha }}
        run: |
          if [[ ! "${REVISION}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Revision must be an immutable full commit SHA"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: "10.23.0"

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check docs
        run: pnpm check:docs

      - name: Check docs links
        run: pnpm docs:linkcheck

      - name: Validate Mintlify docs
        run: pnpm docs:validate

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate revision
        shell: bash
        env:
          REVISION: ${{ github.sha }}
        run: |
          if [[ ! "${REVISION}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Revision must be an immutable full commit SHA"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install security tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install pre-commit detect-secrets==1.5.0

      - name: Detect secrets baseline
        run: detect-secrets scan --baseline .secrets.baseline

      - name: Detect private keys
        run: pre-commit run --all-files detect-private-key

      - name: Lint GitHub Actions workflows
        run: pre-commit run --all-files --hook-stage manual actionlint

      - name: Audit GitHub Actions workflows
        run: pre-commit run --all-files --hook-stage manual zizmor

  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate revision
        shell: bash
        env:
          REVISION: ${{ github.sha }}
        run: |
          if [[ ! "${REVISION}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Revision must be an immutable full commit SHA"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          checksums="gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          base_url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"

          curl -fsSLO "${base_url}/${archive}"
          curl -fsSLO "${base_url}/${checksums}"
          grep " ${archive}$" "${checksums}" | sha256sum --check --strict

          mkdir -p "${RUNNER_TEMP}/gitleaks-bin"
          tar -xzf "${archive}" -C "${RUNNER_TEMP}/gitleaks-bin" gitleaks
          echo "${RUNNER_TEMP}/gitleaks-bin" >> "${GITHUB_PATH}"

      - name: Run gitleaks
        run: gitleaks git --no-banner --redact .

  policy:
    runs-on: ubuntu-latest
    steps:
      - name: Validate revision
        shell: bash
        env:
          REVISION: ${{ github.sha }}
        run: |
          if [[ ! "${REVISION}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Revision must be an immutable full commit SHA"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Validate CI policy baseline
        run: node scripts/validate-ci-policy.mjs

  desktop-artifact:
    needs: [scope]
    if: needs.scope.outputs.docs_only != 'true' && needs.scope.outputs.desktop_changed == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Validate revision
        shell: bash
        env:
          REVISION: ${{ github.sha }}
        run: |
          if [[ ! "${REVISION}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Revision must be an immutable full commit SHA"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: "10.23.0"

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build macOS desktop artifact
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: pnpm build:desktop

      - name: Upload desktop artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "openboa-desktop-macos"
          path: "artifacts/desktop/*.zip"
          if-no-files-found: "error"

  required-ci:
    name: required-ci
    needs: [scope, check, docs, secrets, gitleaks, policy, desktop-artifact, dependency-audit]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Evaluate job results
        shell: bash
        run: |
          scope_result="${{ needs.scope.result }}"
          docs_only="${{ needs.scope.outputs.docs_only }}"
          docs_changed="${{ needs.scope.outputs.docs_changed }}"
          desktop_changed="${{ needs.scope.outputs.desktop_changed }}"
          check_result="${{ needs.check.result }}"
          docs_result="${{ needs.docs.result }}"
          secrets_result="${{ needs.secrets.result }}"
          gitleaks_result="${{ needs.gitleaks.result }}"
          policy_result="${{ needs.policy.result }}"
          desktop_result="${{ needs.desktop-artifact.result }}"
          dependency_audit_result="${{ needs.dependency-audit.result }}"

          echo "scope:    ${scope_result}"
          echo "check:    ${check_result}"
          echo "docs:     ${docs_result}"
          echo "secrets:  ${secrets_result}"
          echo "gitleaks: ${gitleaks_result}"
          echo "policy:   ${policy_result}"
          echo "desktop:  ${desktop_result}"
          echo "dependency audit: ${dependency_audit_result}"

          failed=0
          for flag in "${docs_only}" "${docs_changed}" "${desktop_changed}"; do
            if [[ "${flag}" != "true" && "${flag}" != "false" ]]; then
              echo "Invalid scope output: ${flag}"
              failed=1
            fi
          done
          if [[ "${docs_only}" == "true" && "${docs_changed}" != "true" ]]; then
            echo "Docs-only scope must include a docs change"
            failed=1
          fi

          require_result() {
            local name="$1" result="$2" allow_skip="${3:-false}"
            if [[ "${result}" == "success" ]]; then
              return
            fi
            if [[ "${scope_result}" == "success" && "${allow_skip}" == "true" && "${result}" == "skipped" ]]; then
              return
            fi
            echo "${name} did not complete successfully: ${result}"
            failed=1
          }

          require_result scope "${scope_result}"
          require_result secrets "${secrets_result}"
          require_result gitleaks "${gitleaks_result}"
          require_result policy "${policy_result}"
          require_result dependency-audit "${dependency_audit_result}"
          require_result check "${check_result}" "${docs_only}"

          docs_may_skip=false
          if [[ "${docs_changed}" == "false" ]]; then
            docs_may_skip=true
          fi
          require_result docs "${docs_result}" "${docs_may_skip}"

          desktop_may_skip=false
          if [[ "${docs_only}" == "true" || "${desktop_changed}" == "false" ]]; then
            desktop_may_skip=true
          fi
          require_result desktop-artifact "${desktop_result}" "${desktop_may_skip}"

          if [[ "${failed}" -ne 0 ]]; then
            echo "required-ci failed"
            exit 1
          fi

          echo "required-ci passed"
