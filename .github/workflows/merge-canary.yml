name: merge-canary

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  checks: read
  pull-requests: read

concurrency:
  group: merge-canary-reporter
  cancel-in-progress: false

jobs:
  report:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Only an immutable main-branch controller and pinned evaluator execute.
      - name: Checkout trusted controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Checkout reviewed evaluator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: openboa-ai/.github
          ref: e1ec2781ec180c96bcd520a497780bf6b8dc29ca
          path: .merge-evaluator
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Validate trusted evidence boundary
        env:
          MERGE_EVALUATOR_MODULE: ${{ github.workspace }}/.merge-evaluator/lib/evaluate-merge-evidence.mjs
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          node --test test/merge-canary-adapter.test.mjs
          python3 -B -m unittest discover -s test -p 'test_collect_merge_evidence.py'
          python3 -B -m unittest discover -s test -p 'test_run_merge_canary.py'

      - name: Report one rotating current PR
        id: canary
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_WORKFLOW_SHA: ${{ github.workflow_sha }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 -I -B scripts/run-merge-canary.py \
            --event "$GITHUB_EVENT_PATH" \
            --output "$RUNNER_TEMP/merge-canary-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"

      - name: Upload bounded canary report
        if: always() && !cancelled() && steps.canary.outputs.report-path != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: merge-canary-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.canary.outputs.report-path }}
          if-no-files-found: error
          retention-days: 7
